name: tagged

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'      # ej. v1.2.0

jobs:
  build-and-test:
    name: Maven verify (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile, lint and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

  push_to_docker_hub_registry:
    name: Push Docker image to docker hub (tag = SemVer)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            
      - name: Validar version
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$TAGS" ]; then
            echo "::error::No se genero ningún tag de imagen para '$REF_NAME' (se espera X.Y.Z)"
            exit 1
          fi
          if ! [[ "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag inválido: '$REF_NAME' (se espera X.Y.Z)"
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
      name: Deploy release to Render
      runs-on: ubuntu-latest
      needs: push_to_docker_hub_registry
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        IMAGE_URL: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ github.ref_name }}
      steps:
        - name: Trigger deployment of the published image
          run: |
            curl --fail --silent --show-error \
              --get \
              --data-urlencode "imgURL=${IMAGE_URL}" \
              --output /dev/null \
              "${RENDER_DEPLOY_HOOK_URL}"

