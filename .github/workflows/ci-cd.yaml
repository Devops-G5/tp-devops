name: CI-CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  workflow_dispatch:  #Habilita la ejecución manual para probarlo
  
jobs:
  build-and-test:
    name: Maven verify (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compile, lint and test
        run: ./mvnw --batch-mode --no-transfer-progress verify
        
  push_to_docker_hub_registry:
      name: Push Docker image to docker hub (tag = hash)
      runs-on: ubuntu-latest
      needs: build-and-test
      if: github.ref == 'refs/heads/main'

      steps:
        - name: Check out repo
          uses: actions/checkout@v4
        
        - name: Log in to docker hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Extract metadata (tags, labels) for Docker
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}

        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}
            labels: ${{ steps.meta.outputs.labels }}
            build-args: |
              BUILD_DATE=${{ github.event.repository.updated_at }}
              # APP_VERSION=${{ github.sha }}