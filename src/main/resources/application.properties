spring.application.name=devops
spring.mongodb.uri=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/mydatabase?authSource=admin
springdoc.api-docs.enabled= true
springdoc.swagger-ui.enabled= true


## Telemetry
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

## Logs JSON
logging.structured.format.console=logstash
logging.structured.json.rename.@timestamp=timestamp
spring.main.banner-mode=off