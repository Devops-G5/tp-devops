services:
  api-tester:
    build:
      context: ./api-tester
    environment:
      BASE_URL: https://tp-devops-g5-1-1-0.onrender.com
      ITERATIONS: "3"
      SLEEP_SECONDS: "2"
      MAX_WAIT: "120" # Tiempo de espera antes de comenzar con las pruebas
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    env_file:
      - .env
    volumes:
      - ./observability/config-render.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
volumes:
  alloy-data: