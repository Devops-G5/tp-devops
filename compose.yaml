services:
  mongodb:
    image: mongo:8.3.11
    environment:
      MONGO_INITDB_DATABASE: mydatabase
    ports:
      - "27017:27017"
    healthcheck:
      test: [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_INITDB_ROOT_USERNAME}",
          "--password",
          "${MONGO_INITDB_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    env_file:
      - .env-database
  api:
    build:
      context: .
      args:
        BUILD_DATE: ${BUILD_DATE}
    container_name: devops_app
    image: devops_app:${APP_VERSION}
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env-database